# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb-pipeline"
version = "0.0.0"
description = "Pipeline for IMDb data."
authors = [{name = "billwallis"}]
maintainers = [{name = "billwallis"}]
readme = "README.md"
urls.Homepage = "https://github.com/billwallis/imdb-pipeline"
urls.Repository = "https://github.com/billwallis/imdb-pipeline"
urls.Issues = "https://github.com/billwallis/imdb-pipeline/issues"
urls.Documentation = "https://github.com/billwallis/imdb-pipeline/blob/main/README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "dbt>=2.0.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
]


[tool.poe]
verbosity = -1
envfile.optional = ".env"

[tool.poe.tasks]
install.shell = """
    pip install \
        --editable . \
        --group dev \
        --uploaded-prior-to P7D \
        --force-reinstall
    pre-commit install --install-hooks
"""
clean.shell = """
    dbt clean
    rm -rf src/imdb_pipeline/dist/
    rm -rf src/imdb_pipeline/logs/
    rm -rf src/imdb_pipeline/target/
    dbt deps
"""
compile.shell = """
    dbt compile --no-warn-error --write-metadata --write-lineage
    dbt compile --no-warn-error
"""

[tool.poe.tasks.lint]
control.expr = "sys.platform"

[[tool.poe.tasks.lint.switch]]
case = "win32"
shell = """
    echo '=== pre-commit checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '=== pre-push checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""

[[tool.poe.tasks.lint.switch]]
shell = """
    echo '\\033[0;34mpre-commit checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '\\033[0;34mpre-push checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""
